name: HuBERT main experiment

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/hubert-main-experiment-20260811

jobs:
  run-hubert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install torch torchaudio pandas numpy matplotlib safetensors
      - name: Run pretrained HuBERT experiment
        run: |
          python experiments/hubert_pretrained_main.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hubert-pretrained-main-results
          path: hubert_pretrained_results
